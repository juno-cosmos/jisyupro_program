
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SVG矢印ボタン</title>
  <style>
    .svg-button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      outline: none;
    }

    .svg-button svg {
      width: 100px;
      height: 60px;
    }

    .arrow-shape {
      fill: #f0f0f0;
      stroke: black;
      stroke-width: 3;
      filter: drop-shadow(3px 3px 0 black);
      transition: fill 0.2s;
    }

    .svg-button:hover .arrow-shape {
      fill: #ddd;
    }
  </style>
</head>
<body>

  <button class="svg-button">
    <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
      <polygon class="arrow-shape" points="0,0 70,0 100,30 70,60 0,60" />
    </svg>
  </button>

</body>
</html>
