<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wii U ゲームパッド風 UI</title>
  <style>
    body {
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    .wiiu-gamepad {
      position: relative;
      width: 500px;
      height: 300px;
      background: #111;
      border-radius: 40px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
      padding: 20px;
    }

    .screen {
      width: 300px;
      height: 180px;
      margin: 0 auto;
      background: #ccc;
      border: 6px solid #000;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      color: #333;
    }

    .button {
      position: absolute;
      width: 30px;
      height: 30px;
      background: #444;
      border-radius: 50%;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .button-left {
      top: 100px;
      left: 40px;
    }

    .button-right {
      top: 100px;
      right: 40px;
    }

    .button-home {
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      background: #666;
    }
  </style>
</head>
<body>
  <div class="wiiu-gamepad">
    <div class="screen">
      <p>Wii U ゲーム画面</p>
    </div>
    <div class="button button-left"></div>
    <div class="button button-right"></div>
    <div class="button button-home"></div>
  </div>
</body>
</html>
